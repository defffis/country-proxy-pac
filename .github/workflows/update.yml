name: Update Country Proxy PACs

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: country-proxy-pac-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Update proxy data and PAC files
        run: python src/update.py

      - name: Validate generated files
        run: |
          python -m json.tool data/stats.json > /dev/null
          python -m json.tool data/proxies.json > /dev/null
          for country in turkey india poland netherlands germany usa uk; do
            python -m json.tool "data/${country}.json" > /dev/null
            test -s "pac/${country}.pac"
            test -s "pac/${country}-http.pac"
            test -s "pac/${country}-socks.pac"
            for protocol in http https socks4 socks5; do
              test -f "proxies/${country}-${protocol}.txt"
            done
          done

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data pac proxies index.html
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m 'chore: update country proxy lists'
            git push
          fi
